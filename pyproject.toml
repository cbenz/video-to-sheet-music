[project]
name = "video-to-sheet-music"
version = "0.1.0"
description = "Convert a slideshow video into a printable A4 PDF"
readme = "README.md"
requires-python = ">=3.14"
dependencies = ["reportlab>=4.5.1"]

[project.scripts]
video-to-sheet-music = "video_to_sheet_music.cli.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/video_to_sheet_music"]
